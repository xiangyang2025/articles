<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>晨光里的温柔秩序</title><style>body{max-width:760px;margin:40px auto;padding:0 20px;font:18px/1.8 system-ui;color:#222}img{max-width:100%;height:auto}</style></head><body><article><h1>晨光里的温柔秩序</h1><p>晨光里的温柔秩序</p><p>清晨的第一缕阳光洒在窗台时，世界还没有完全喧闹起来。给自己的早晨留出十分钟安静，整理好心情再出发，一天的节奏都会变得从容而清晰。</p></article></body></html>
