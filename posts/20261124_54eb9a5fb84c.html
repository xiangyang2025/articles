<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>把日子过得轻盈一些，烦恼自然就少了</title><style>body{max-width:760px;margin:40px auto;padding:0 20px;font:18px/1.8 system-ui;color:#222}img{max-width:100%;height:auto}</style></head><body><article><h1>把日子过得轻盈一些，烦恼自然就少了</h1><p>把日子过得轻盈一些，烦恼自然就少了</p><p>人生的很多疲惫，往往不是因为事情太多，而是心里装了太多尚未发生的担忧。试着把注意力放回眼前这一件小事，做完它，再去想下一件。心轻了，脚步也就稳了。</p></article></body></html>
